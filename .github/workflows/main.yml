name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble afat debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          for pkg in "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"; do
            for attempt in 1 2 3; do
              if sdkmanager --install "$pkg" > /dev/null; then
                echo "Installed $pkg"
                break
              fi
              echo "Attempt $attempt failed for $pkg"
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep 10
            done
          done

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble afat debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find TMessagesProj_App -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-afat-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
